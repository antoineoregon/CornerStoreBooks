<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home - CornerStoreBooks</title>

    <link rel="stylesheet" href="../assets/css/style.css">
</head>
<body>
    <header>
        <h1>CornerStoreBooks</h1>
        <nav>
            <a href="mylist.html">My List</a>
            <a href="settings.html">Settings</a>
            <button type="button" onclick="logout()">Logout</button>
        </nav>
    </header>

    <main>
        <section id="recommendations-section">
            <h2>Recommended for You</h2>
            <div id="recommendations-grid" class="book-grid"></div>
        </section>

        <section id="discovery-section" style="text-align: center; margin: 40px 0;">
            <h2>Find Something New</h2>
            <button id="show-discovery-btn">Discover New Genres</button>
            <div id="discovery-tags-container" style="margin-top: 20px;"></div>
        </section>

        <hr style="margin: 40px 0; border: 0; border-top: 1px solid #eee;">

        <section id="catalog-section">
            <h2>All Books</h2>
            <div class="book-grid"></div>
        </section>
    </main>

    <noscript>
        <p>This application requires JavaScript to function properly.</p>
    </noscript>

    <!-- App logic -->
    <script src="../assets/js/app.js"></script>

    <!-- Page-specific logic -->
    <script>
        // Simple auth guard
        if (!localStorage.getItem('userId')) {
            window.location.replace('../index.html');
        }

        function logout() {
            localStorage.removeItem('userId');
            window.location.replace('../index.html');
        }
    </script>
</body>
</html>
